name: Update projections and deploy

on:
  schedule:
    # Every hour. nflverse refreshes stats after games, injury reports through the week and depth charts
    # daily; a run that finds no new data stops before deploying.
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download public NFL data
        run: scripts/fetch_data.sh
      - name: Build projections
        run: python scripts/model.py data data/data.json
      - name: Rebuild past weekly projections (Report Card)
        run: python scripts/history.py data data/history.json
      - name: Build site
        run: python scripts/build.py data/data.json site
      - name: Compare with the live site
        id: diff
        env:
          LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          def core(d):
              d = dict(d); d["meta"] = {k: v for k, v in d["meta"].items() if k != "built"}
              return json.dumps(d, sort_keys=True)
          new = core(json.load(open("site/data.json"))) + open("site/history.json").read()
          try:
              old = core(json.load(urllib.request.urlopen(os.environ["LIVE_URL"], timeout=30)))
              old += urllib.request.urlopen(os.environ["LIVE_URL"].replace("data.json", "history.json"), timeout=30).read().decode()
          except Exception as e:
              print("Live data not readable:", e); old = None
          changed = os.environ["EVENT"] != "schedule" or old != new
          print("Deploying." if changed else "No new data since the last deploy; skipping.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          PY
      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
