name: Update projections and deploy

on:
  schedule:
    # 6:20 AM Central, every day (fresh stats Tuesday, injury reports Wed–Sat, depth charts any day)
    - cron: "20 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download public NFL data
        run: scripts/fetch_data.sh
      - name: Build projections
        run: python scripts/model.py data data/data.json
      - name: Build site
        run: python scripts/build.py data/data.json site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
